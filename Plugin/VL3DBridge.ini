; =============================================================================
; VL3DBridge.ini — Configuration for VL3DBridge.aux2 (v1.22)
;   [JA] VolumetricLight3D（体積光（3D））用 無ロック読取ブリッジ＆D3D11 CS 3Dラスタライザ設定（Plugin\VL3DBridge.ini）
;   [EN] Lock-free read-only bridge & D3D11 CS 3D rasterizer settings (place next to VL3DBridge.aux2)
;   [ZH] 体积光（3D）无锁只读桥接与 D3D11 CS 3D 硬件光栅化插件配置（与 VL3DBridge.aux2 同目录）
; =============================================================================
[Security]
; strict_whitelist_only:
;   0 = Hybrid verification (Default / 既定 / 默认):
;       Uses official AviUtl2 SDK APIs first; permits read-only fallback probes only when
;       aviutl2.exe matches the allowlist OR passes PE64 code-pattern & invariant checks.
;       Automatically degrades to pure SDK mode on unknown future host layouts.
;   1 = Strict allowlist only (厳格ホワイトリスト / 严格白名单):
;       Permits read-only fallback probes ONLY when SHA-256 or PE header matches below.
strict_whitelist_only = 0

; Verified official AviUtl ExEdit2 PE32+ fingerprints (TimeDateStamp,SizeOfImage):
;   v2.1.16 (2026-10-31): 0x6AE538B8,0x005F6000
;   v2.1.15 (2026-10-24): 0x6ADC1302,0x005F5000
; Note: VL3DBridge v1.22+ computes status.sha256 from the on-disk aviutl2.exe file
; (ASLR-invariant, matching `Get-FileHash aviutl2.exe -Algorithm SHA256`), and also
; accepts multiple `allow_pe` / `allow_sha256` entries across lines.
allow_pe = 0x6AE538B8,0x005F6000
allow_pe = 0x6ADC1302,0x005F5000
allow_sha256 = ea321cfb5c5c171b0fb5496c6aab715171e4d240f999ea2a9b79b074fc9bd688

[GPU]
; enable_d3d11_cs:
;   1 = Enable Direct3D 11 Compute Shader (cs_5_0) hardware 3D shadow & depth rasterizer
;       on AviUtl2 v2.1.15+ via EDIT_HANDLE::get_direct3d_device() (Recommended / 推奨 / 推荐)
;   0 = Disable D3D11 CS and use built-in C++17 -O3 CPU rasterizer
enable_d3d11_cs = 1
force_cpu_rasterizer = 0
